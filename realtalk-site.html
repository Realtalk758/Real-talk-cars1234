<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real Talk – Cars, Property & Second-Hand Deals</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --brand:#F5B800;--brand-d:#d99f00;--ink:#111;
  --bg:#f6f4ee;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--line:#e6e2d6;--chip:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212;--card:#1d1d1d;--text:#f1f1f1;--muted:#a3a3a3;--line:#333;--chip:#1d1d1d;}}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1d;--text:#f1f1f1;--muted:#a3a3a3;--line:#333;--chip:#1d1d1d;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* header */
header{background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--brand)}
.hbar{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.brand img{width:46px;height:46px;border-radius:50%;border:2px solid var(--brand);object-fit:cover}
.brand b{font-size:20px;line-height:1}.brand small{display:block;color:var(--brand);font-size:11px;letter-spacing:3px;font-weight:700}
nav{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a{padding:8px 13px;border-radius:8px;font-weight:600;font-size:14px;color:#ddd}
nav a:hover,nav a.on{background:var(--brand);color:#000}
nav a.login{border:1.5px solid var(--brand);color:var(--brand)}
nav a.login:hover{color:#000}
.burger{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:26px}
@media(max-width:820px){.burger{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--ink);flex-direction:column;align-items:stretch;padding:10px 18px 16px}nav.open{display:flex}}
/* hero */
.hero{background:linear-gradient(135deg,#000 0%,#1c1c1c 55%,#2a2200 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(245,184,0,.07) 0 14px,transparent 14px 28px)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.08;margin:0 0 12px;font-weight:900}
.hero h1 span{color:var(--brand)}
.hero p{color:#cfcfcf;max-width:520px;margin:0 0 22px;font-size:17px}
.search{display:flex;background:#fff;border-radius:12px;overflow:hidden;max-width:560px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.search input{flex:1;border:0;padding:15px 16px;font-size:16px;outline:0;color:#111;min-width:0}
.search button{border:0;background:var(--brand);color:#000;font-weight:800;padding:0 22px}
.hero-logo{justify-self:center}
.hero-logo img{width:min(300px,70vw);border-radius:50%;border:6px solid var(--brand);box-shadow:0 0 0 8px rgba(245,184,0,.2),0 20px 50px rgba(0,0,0,.6)}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero-logo{order:-1}.hero-logo img{width:150px}}
/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:-34px;position:relative}
.tile{background:var(--card);border-radius:16px;padding:22px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;gap:16px;align-items:center;transition:.2s}
.tile:hover{transform:translateY(-4px);border-color:var(--brand)}
.tile .ic{font-size:36px;background:var(--brand);color:#000;border-radius:14px;width:62px;height:62px;display:grid;place-items:center;flex:none}
.tile h3{margin:0;font-size:19px}.tile p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
@media(max-width:700px){.tiles{grid-template-columns:1fr}}
/* sections */
section.block{padding:44px 0 6px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{margin:0;font-size:28px;font-weight:900}.sh h2::after{content:"";display:block;width:54px;height:5px;background:var(--brand);border-radius:3px;margin-top:6px}
.sh a{color:var(--muted);font-weight:700;font-size:14px}.sh a:hover{color:var(--brand-d)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.chip{border:1.5px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:7px 15px;font-weight:700;font-size:13.5px}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#000}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;min-width:0}
.toolbar input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.16);border-color:var(--brand)}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,#222,#3a3000);display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--brand);color:#000;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.badge.sold{background:#c62828;color:#fff;left:auto;right:10px}
.cb{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{margin:0;font-size:17px;line-height:1.25}
.price{font-weight:900;font-size:19px;color:var(--brand-d)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px}
.loc{color:var(--muted);font-size:13px;margin-top:auto}
.empty{padding:40px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:0;border-radius:10px;padding:11px 18px;font-weight:800;background:var(--brand);color:#000}
.btn:hover{background:var(--brand-d)}
.btn.dark{background:#111;color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.wa{background:#25D366;color:#fff}.btn.red{background:#c62828;color:#fff}.btn.sm{padding:6px 11px;font-size:13px}
/* modal */
#modal .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:grid;place-items:center;padding:14px;overflow:auto}
.dlg{background:var(--card);border-radius:18px;max-width:880px;width:100%;max-height:92vh;overflow:auto;position:relative}
.dlg .x{position:absolute;right:12px;top:12px;z-index:3;background:#000;color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:18px}
.dgrid{display:grid;grid-template-columns:1.1fr .9fr}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}}
.dgrid .ph{aspect-ratio:auto;min-height:260px;height:100%}
.thumbs{display:flex;gap:6px;padding:8px;background:#000;overflow-x:auto}
.thumbs img{width:62px;height:48px;object-fit:cover;border-radius:6px;opacity:.6;cursor:pointer}.thumbs img.on{opacity:1;outline:2px solid var(--brand)}
.dinfo{padding:22px;display:flex;flex-direction:column;gap:12px}
.dinfo h2{margin:0}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.specs div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}.specs b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* forms */
form.f{display:grid;gap:12px;padding:22px}
form.f label{display:grid;gap:5px;font-weight:700;font-size:13px}
form.f input,form.f select,form.f textarea{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.imgprev{display:flex;gap:8px;flex-wrap:wrap}
.imgprev div{position:relative}.imgprev img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.imgprev button{position:absolute;top:-6px;right:-6px;background:#c62828;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1}
/* login */
.loginbox{max-width:430px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.loginbox .top{background:var(--ink);color:#fff;text-align:center;padding:26px 20px;border-bottom:4px solid var(--brand)}
.loginbox .top img{width:84px;height:84px;border-radius:50%;border:3px solid var(--brand)}
.loginbox .top h2{margin:10px 0 2px}.loginbox .top p{margin:0;color:#bbb;font-size:14px}
.loginbox .body{padding:24px;display:grid;gap:14px}
.status{padding:12px 14px;border-radius:10px;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.status.ok{background:#e8f6ea;border-color:#9ad3a2;color:#14532d}
:root[data-theme="dark"] .status.ok{background:#12301a;color:#a7e3b3}
/* admin */
.adminbar{background:var(--brand);color:#000;font-weight:700;padding:8px 0;font-size:14px}
.adminbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tw{overflow-x:auto}
.t th,.t td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
.t th{background:var(--ink);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.t img{width:52px;height:40px;object-fit:cover;border-radius:6px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:28px;display:block;color:var(--brand-d)}
/* about/footer */
.about{background:var(--ink);color:#fff;border-radius:20px;padding:30px;margin:44px 0 0;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.about h3{margin:0 0 6px;font-size:24px;color:var(--brand)}.about p{margin:0;color:#ccc}
@media(max-width:700px){.about{grid-template-columns:1fr}}
footer{background:var(--ink);color:#bbb;margin-top:50px;padding:34px 0 24px;border-top:4px solid var(--brand);font-size:14px}
footer .fg{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.soc{display:flex;gap:10px}.soc a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.soc .yt{background:#f00}.soc .tt{background:#000;border:1.5px solid #555}.soc .fb{background:#1877f2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:10px;z-index:99;border:1px solid var(--brand);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style>

let S=JSON.parse(document.getElementById('state').textContent);
let isAdmin=false,artifact=null,userCap=null,authChecked=false;
let view={cars:'All',property:'All',items:'All',q:'',sort:'new'};
const CATS={
  cars:['XLI','GLI','Altis','Altis Grande','Civic','City','Cultus','Alto','Other'],
  property:['House','Flat','Plot','Shop','Commercial','Other'],
  items:['Mobiles','Electronics','Furniture','Appliances','Bikes','Other']
};
const TYPE={cars:{n:'Cars',ic:'🚗',d:'XLI, GLI, Altis & more'},property:{n:'Property',ic:'🏠',d:'Houses, plots, flats & shops'},items:{n:'Second-Hand',ic:'📦',d:'Mobiles, furniture & more'}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmt=n=>n?'PKR '+Number(n).toLocaleString('en-PK'):'Price on call';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- auth ---------- */
async function initAuth(){
  try{
    if(typeof claude!=='undefined'){
      userCap=await claude.use('user');
      artifact=await claude.use('artifact');
      isAdmin=!!(userCap&&userCap.canEdit()&&artifact);
    }
  }catch(e){isAdmin=false}
  authChecked=true;render();
}
async function persist(msg){
  if(!isAdmin||!artifact){toast('Admin only');return false}
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#root').innerHTML='';clone.querySelector('#modal').innerHTML='';clone.querySelector('#nav').innerHTML='';
  clone.querySelectorAll('.toast').forEach(e=>e.remove());
  clone.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  clone.querySelector('body').removeAttribute('style');
  try{await artifact.publish('<!DOCTYPE html>\n'+clone.outerHTML);toast(msg||'Saved ✔');return true}
  catch(e){toast('Could not save: '+(e.code||e.message||'error'));return false}
}

/* ---------- routing ---------- */
const route=()=>(location.hash.replace('#/','')||'home').split('?')[0];
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0)});
$('#burger').onclick=()=>$('#nav').classList.toggle('open');

function renderNav(){
  const r=route();
  const l=(h,t,c='')=>`<a href="#/${h}" class="${r===h||(h==='home'&&r==='home')?'on':''} ${c}">${t}</a>`;
  $('#nav').innerHTML=l('home','Home')+l('cars','Cars')+l('property','Property')+l('items','Second-Hand')+l('contact','Contact')+
    (isAdmin?l('admin','⚙ Dashboard'):l('login','🔐 Admin Login','login'));
  $('#nav').classList.remove('open');
}

function render(){
  renderNav();
  const r=route(),root=$('#root');
  if(r==='login')root.innerHTML=loginPage();
  else if(r==='admin')root.innerHTML=isAdmin?adminPage():(authChecked?loginPage():'<div class="wrap"><p>Loading…</p></div>');
  else if(r==='cars'||r==='property'||r==='items')root.innerHTML=listPage(r);
  else if(r==='contact')root.innerHTML=contactPage()+footer();
  else root.innerHTML=homePage();
  if(!['login'].includes(r)||true)root.insertAdjacentHTML('beforeend',r==='contact'?'':footer());
  if(r==='contact')root.querySelectorAll('footer').forEach((f,i)=>i&&f.remove());
  if(isAdmin&&r!=='admin')root.insertAdjacentHTML('afterbegin',`<div class="adminbar"><div class="wrap">🔓 Admin mode <button class="btn dark sm" onclick="openForm()">+ Add listing</button><a class="btn ghost sm" style="color:#000;border-color:#000" href="#/admin">Dashboard</a></div></div>`);
  if(S.settings.whatsapp)root.insertAdjacentHTML('beforeend',`<a class="fab" href="https://wa.me/${esc(S.settings.whatsapp)}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>`);
}

/* ---------- pages ---------- */
function card(l){
  const img=l.images&&l.images[0];
  const sp=l.type==='cars'?[l.year,l.mileage?Number(l.mileage).toLocaleString()+' km':'',l.trans,l.fuel]:
           l.type==='property'?[l.area,l.beds?l.beds+' bed':'',l.baths?l.baths+' bath':'']:[l.condition];
  return `<div class="card" onclick="openDetail('${l.id}')">
    <div class="ph">${img?`<img loading="lazy" src="${img}" alt="${esc(l.title)}">`:TYPE[l.type].ic}
      <span class="badge">${esc(l.cat)}</span>${l.sold?'<span class="badge sold">SOLD</span>':''}</div>
    <div class="cb"><h3>${esc(l.title)}</h3><div class="price">${fmt(l.price)}</div>
    <div class="meta">${sp.filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    <div class="loc">📍 ${esc(l.location||'—')}</div></div></div>`;
}
function homePage(){
  const feat=t=>S.listings.filter(l=>l.type===t).sort((a,b)=>b.date-a.date).slice(0,4);
  const sec=t=>`<section class="block"><div class="sh"><h2>Latest ${TYPE[t].n}</h2><a href="#/${t}">View all →</a></div>
    <div class="grid">${feat(t).map(card).join('')||'<div class="empty">No listings yet.</div>'}</div></section>`;
  return `<div class="hero"><div class="wrap"><div>
    <h1>Buy &amp; sell with <span>Real Talk</span></h1>
    <p>Honest deals on cars, property and second-hand items — checked and shown by the Real Talk Vlogs team.</p>
    <form class="search" onsubmit="event.preventDefault();view.q=this.q.value;location.hash='#/cars'"><input name="q" placeholder="Search Corolla XLI, house, iPhone…"><button>Search</button></form>
    </div><div class="hero-logo"><img src="${LOGO}" alt="Real Talk Vlogs"></div></div></div>
    <div class="wrap"><div class="tiles">${Object.keys(TYPE).map(t=>`<a class="tile" href="#/${t}"><div class="ic">${TYPE[t].ic}</div><div><h3>${TYPE[t].n}</h3><p>${TYPE[t].d}</p></div></a>`).join('')}</div>
    ${sec('cars')}${sec('property')}${sec('items')}
    <div class="about"><div><h3>Real Talk. Real Deals.</h3><p>Watch our vlogs on YouTube, TikTok and Facebook, then message us directly on WhatsApp to buy or sell.</p></div>
    <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(S.settings.whatsapp)}">💬 Chat on WhatsApp</a></div></div>`;
}
function listPage(t){
  let ls=S.listings.filter(l=>l.type===t);
  if(view[t]!=='All')ls=ls.filter(l=>l.cat===view[t]);
  const q=view.q.trim().toLowerCase();
  if(q)ls=ls.filter(l=>(l.title+' '+l.cat+' '+l.location+' '+l.desc).toLowerCase().includes(q));
  ls.sort((a,b)=>view.sort==='low'?a.price-b.price:view.sort==='high'?b.price-a.price:b.date-a.date);
  return `<div class="wrap"><section class="block"><div class="sh"><h2>${TYPE[t].ic} ${TYPE[t].n}</h2>
    ${isAdmin?`<button class="btn" onclick="openForm(null,'${t}')">+ Add ${TYPE[t].n}</button>`:''}</div>
    <div class="chips">${['All',...CATS[t]].map(c=>`<button class="chip ${view[t]===c?'on':''}" onclick="setCat('${t}','${c}')">${c}</button>`).join('')}</div>
    <div class="toolbar"><input placeholder="Search in ${TYPE[t].n}…" value="${esc(view.q)}" oninput="view.q=this.value;liveGrid('${t}')">
    <select onchange="view.sort=this.value;render()"><option value="new" ${view.sort==='new'?'selected':''}>Newest</option><option value="low" ${view.sort==='low'?'selected':''}>Price: low → high</option><option value="high" ${view.sort==='high'?'selected':''}>Price: high → low</option></select></div>
    <div class="grid" id="gridbox">${ls.map(card).join('')||'<div class="empty" style="grid-column:1/-1">Nothing found in this category yet.</div>'}</div></section></div>`;
}
function liveGrid(t){
  let ls=S.listings.filter(l=>l.type===t);
  if(view[t]!=='All')ls=ls.filter(l=>l.cat===view[t]);
  const q=view.q.trim().toLowerCase();
  if(q)ls=ls.filter(l=>(l.title+' '+l.cat+' '+l.location+' '+l.desc).toLowerCase().includes(q));
  $('#gridbox').innerHTML=ls.map(card).join('')||'<div class="empty" style="grid-column:1/-1">Nothing found.</div>';
}
function setCat(t,c){view[t]=c;render()}
function contactPage(){
  const s=S.settings;
  return `<div class="wrap"><section class="block"><div class="sh"><h2>Contact Real Talk</h2></div>
  <div class="tiles" style="margin-top:0">
  <a class="tile" target="_blank" rel="noopener" href="https://wa.me/${esc(s.whatsapp)}"><div class="ic">💬</div><div><h3>WhatsApp</h3><p>${esc(s.whatsapp)}</p></div></a>
  <a class="tile" href="tel:${esc(s.phone||s.whatsapp)}"><div class="ic">📞</div><div><h3>Call us</h3><p>${esc(s.phone||s.whatsapp)}</p></div></a>
  <div class="tile"><div class="ic">📍</div><div><h3>Location</h3><p>${esc(s.address)}</p></div></div></div></section></div>`;
}
function footer(){
  const s=S.settings;
  return `<footer><div class="wrap fg"><div class="brand"><img src="${LOGO}" alt=""><div><b>REAL TALK</b><small>VLOGS</small></div></div>
  <div>© ${new Date().getFullYear()} Real Talk. All rights reserved.</div>
  <div class="soc"><a class="yt" href="${esc(s.youtube||'#')}" target="_blank" rel="noopener" aria-label="YouTube">▶</a><a class="tt" href="${esc(s.tiktok||'#')}" target="_blank" rel="noopener" aria-label="TikTok">♪</a><a class="fb" href="${esc(s.facebook||'#')}" target="_blank" rel="noopener" aria-label="Facebook">f</a></div></div></footer>`;
}

/* ---------- detail modal ---------- */
function openDetail(id){
  const l=S.listings.find(x=>x.id===id);if(!l)return;
  const imgs=l.images||[];
  const specs=l.type==='cars'?[['Variant',l.cat],['Model year',l.year],['Mileage',l.mileage?Number(l.mileage).toLocaleString()+' km':''],['Transmission',l.trans],['Fuel',l.fuel],['Engine',l.engine]]:
    l.type==='property'?[['Type',l.cat],['Area',l.area],['Bedrooms',l.beds],['Bathrooms',l.baths]]:[['Category',l.cat],['Condition',l.condition]];
  const msg=encodeURIComponent(`Hi Real Talk, I am interested in: ${l.title} (${fmt(l.price)})`);
  $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="dlg"><button class="x" onclick="closeModal()">✕</button>
  <div class="dgrid"><div><div class="ph" id="mainph">${imgs[0]?`<img src="${imgs[0]}" alt="">`:TYPE[l.type].ic}</div>
  ${imgs.length>1?`<div class="thumbs">${imgs.map((im,i)=>`<img src="${im}" class="${i?'':'on'}" onclick="swapImg(this)">`).join('')}</div>`:''}</div>
  <div class="dinfo"><h2>${esc(l.title)}</h2><div class="price" style="font-size:26px">${fmt(l.price)}</div><div class="loc" style="margin:0">📍 ${esc(l.location||'—')}</div>
  <div class="specs">${specs.filter(s=>s[1]).map(s=>`<div><b>${s[0]}</b>${esc(s[1])}</div>`).join('')}</div>
  <p style="margin:0;white-space:pre-wrap">${esc(l.desc)}</p>
  <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(S.settings.whatsapp)}?text=${msg}">💬 Contact on WhatsApp</a>
  ${isAdmin?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" onclick="openForm('${l.id}')">Edit</button><button class="btn ghost sm" onclick="toggleSold('${l.id}')">${l.sold?'Mark available':'Mark sold'}</button><button class="btn red sm" onclick="delListing('${l.id}')">Delete</button></div>`:''}
  </div></div></div></div>`;
}
function swapImg(el){$('#mainph').innerHTML=`<img src="${el.src}" alt="">`;el.parentNode.querySelectorAll('img').forEach(i=>i.classList.remove('on'));el.classList.add('on')}
function closeModal(){$('#modal').innerHTML=''}

/* ---------- login ---------- */
function loginPage(){
  let body;
  if(!authChecked)body=`<div class="status">Checking sign-in…</div>`;
  else if(isAdmin)body=`<div class="status ok">✔ Signed in as admin. You can add, edit and delete listings.</div><a class="btn" href="#/admin">Open Dashboard</a><a class="btn ghost" href="#/">Go to website</a>`;
  else body=`<div class="status">🔒 This area is for the Real Talk admin only. Open this site while signed in to the admin account to unlock editing.</div>
    <button class="btn" onclick="recheck()">🔐 Sign in as Admin</button><a class="btn ghost" href="#/">← Back to website</a>`;
  return `<div class="wrap"><div class="loginbox"><div class="top"><img src="${LOGO}" alt=""><h2>Admin Login</h2><p>Real Talk Vlogs</p></div><div class="body">${body}</div></div></div>`;
}
async function recheck(){authChecked=false;render();await initAuth();if(isAdmin)location.hash='#/admin';else toast('This account is not an admin')}

/* ---------- admin ---------- */
function adminPage(){
  const c=t=>S.listings.filter(l=>l.type===t).length;
  const s=S.settings;
  return `<div class="adminbar"><div class="wrap">🔓 Admin Dashboard <button class="btn dark sm" onclick="openForm()">+ Add listing</button></div></div>
  <div class="wrap"><section class="block"><div class="stats"><div class="stat"><b>${S.listings.length}</b>Total listings</div><div class="stat"><b>${c('cars')}</b>Cars</div><div class="stat"><b>${c('property')}</b>Property</div><div class="stat"><b>${c('items')}</b>Second-hand</div></div>
  <div class="sh"><h2>All listings</h2></div><div class="tw"><table class="t"><tr><th></th><th>Title</th><th>Type</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr>
  ${S.listings.sort((a,b)=>b.date-a.date).map(l=>`<tr><td>${l.images&&l.images[0]?`<img src="${l.images[0]}">`:TYPE[l.type].ic}</td><td>${esc(l.title)}</td><td>${TYPE[l.type].n}</td><td>${esc(l.cat)}</td><td>${fmt(l.price)}</td><td>${l.sold?'Sold':'Available'}</td>
  <td><button class="btn ghost sm" onclick="openForm('${l.id}')">Edit</button> <button class="btn red sm" onclick="delListing('${l.id}')">Delete</button></td></tr>`).join('')}</table></div>
  <div class="sh" style="margin-top:34px"><h2>Site settings</h2></div>
  <form class="f" style="background:var(--card);border:1px solid var(--line);border-radius:16px" onsubmit="saveSettings(event)">
  <div class="row2"><label>WhatsApp number (with country code, e.g. 923001234567)<input name="whatsapp" value="${esc(s.whatsapp)}"></label><label>Phone<input name="phone" value="${esc(s.phone)}"></label></div>
  <label>Address<input name="address" value="${esc(s.address)}"></label>
  <div class="row2"><label>YouTube link<input name="youtube" value="${esc(s.youtube)}" placeholder="https://youtube.com/@..."></label><label>TikTok link<input name="tiktok" value="${esc(s.tiktok)}" placeholder="https://tiktok.com/@..."></label></div>
  <label>Facebook link<input name="facebook" value="${esc(s.facebook)}" placeholder="https://facebook.com/..."></label>
  <button class="btn">Save settings</button></form></section></div>`;
}
async function saveSettings(e){
  e.preventDefault();const f=new FormData(e.target);
  for(const k of ['whatsapp','phone','address','youtube','tiktok','facebook'])S.settings[k]=(f.get(k)||'').trim();
  S.settings.whatsapp=S.settings.whatsapp.replace(/\D/g,'');
  await persist('Settings saved ✔');
}
let formImgs=[];
function openForm(id,type){
  if(!isAdmin)return;
  const l=id?S.listings.find(x=>x.id===id):{type:type||'cars',cat:'',images:[]};
  formImgs=[...(l.images||[])];
  $('#modal').innerHTML=`<div class="ov"><div class="dlg" style="max-width:640px"><button class="x" onclick="closeModal()">✕</button>
  <form class="f" id="lf" onsubmit="saveListing(event,'${id||''}')"><h2 style="margin:0">${id?'Edit':'Add'} listing</h2>
  <div class="row2"><label>Type<select name="type" onchange="typeChange(this.value)">${Object.keys(TYPE).map(t=>`<option value="${t}" ${l.type===t?'selected':''}>${TYPE[t].n}</option>`).join('')}</select></label>
  <label>Category<select name="cat" id="catsel">${CATS[l.type].map(c=>`<option ${l.cat===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
  <label>Title<input name="title" required value="${esc(l.title)}" placeholder="Toyota Corolla GLI 2018"></label>
  <div class="row2"><label>Price (PKR)<input name="price" type="number" min="0" value="${esc(l.price)}"></label><label>Location<input name="location" value="${esc(l.location)}"></label></div>
  <div id="extra">${extraFields(l.type,l)}</div>
  <label>Description<textarea name="desc" rows="4">${esc(l.desc)}</textarea></label>
  <label>Photos (up to 5)<input type="file" accept="image/*" multiple onchange="addImgs(this)"></label>
  <div class="imgprev" id="prev"></div>
  <label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" name="sold" style="width:auto" ${l.sold?'checked':''}> Mark as sold</label>
  <button class="btn" id="savebtn">Save listing</button></form></div></div>`;
  drawPrev();
}
function extraFields(t,l={}){
  if(t==='cars')return `<div class="row2"><label>Model year<input name="year" value="${esc(l.year)}"></label><label>Mileage (km)<input name="mileage" type="number" value="${esc(l.mileage)}"></label></div>
   <div class="row2"><label>Transmission<select name="trans">${['Manual','Automatic'].map(x=>`<option ${l.trans===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Fuel<select name="fuel">${['Petrol','Diesel','Hybrid','CNG'].map(x=>`<option ${l.fuel===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
   <label>Engine<input name="engine" value="${esc(l.engine)}" placeholder="1300cc"></label>`;
  if(t==='property')return `<div class="row2"><label>Area / size<input name="area" value="${esc(l.area)}" placeholder="5 Marla"></label><label>Bedrooms<input name="beds" type="number" value="${esc(l.beds)}"></label></div><label>Bathrooms<input name="baths" type="number" value="${esc(l.baths)}"></label>`;
  return `<label>Condition<select name="condition">${['Like new','Good','Fair','For parts'].map(x=>`<option ${l.condition===x?'selected':''}>${x}</option>`).join('')}</select></label>`;
}
function typeChange(t){$('#catsel').innerHTML=CATS[t].map(c=>`<option>${c}</option>`).join('');$('#extra').innerHTML=extraFields(t)}
function drawPrev(){$('#prev').innerHTML=formImgs.map((im,i)=>`<div><img src="${im}"><button type="button" onclick="formImgs.splice(${i},1);drawPrev()">×</button></div>`).join('')}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.74))};im.src=r.result};r.readAsDataURL(file)})}
async function addImgs(inp){for(const f of [...inp.files]){if(formImgs.length>=5)break;formImgs.push(await shrink(f))}drawPrev();inp.value=''}
async function saveListing(e,id){
  e.preventDefault();$('#savebtn').disabled=true;
  const f=Object.fromEntries(new FormData(e.target));
  const o={...(id?S.listings.find(x=>x.id===id):{id:'l'+Date.now(),date:Date.now()}),...f,sold:!!f.sold,images:formImgs,price:Number(f.price)||0};
  if(id)S.listings=S.listings.map(x=>x.id===id?o:x);else S.listings.push(o);
  closeModal();render();await persist('Listing saved ✔');
}
async function toggleSold(id){const l=S.listings.find(x=>x.id===id);l.sold=!l.sold;closeModal();render();await persist()}
async function delListing(id){
  if(!confirm('Delete this listing permanently?'))return;
  S.listings=S.listings.filter(x=>x.id!==id);closeModal();render();await persist('Deleted');
}

render();initAuth();
</script>
</body>
</html>
